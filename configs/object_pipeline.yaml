input:
  input_dir: /DATA/raw/object_images
  recursive: true
  image_exts: [".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff"]

output:
  run_root: outputs/runs
  pass_archive_dir: /DATA/clean/object_dataset_v1
  pass_archive_layout: run_subdir
  overwrite: false

filter:
  workers: auto
  short_circuit: true
  operators:
    - name: aspect_ratio
      enabled: true
      params:
        ratio: 2.0
    - name: gray_style
      enabled: true
      params:
        threshold: 1.0
    - name: compression_quality
      enabled: true
      params:
        min_quality: 30
    - name: duplicate
      enabled: true
      params:
        threshold: 9
        hash_size: 8
        window_size: 50

label:
  enabled: true
  input_dir: auto
  annotation_dir: auto
  jsonl_path: auto
  operator:
    name: object_holdable_labeler
    params:
      base_url: http://10.154.39.57:8001/v1
      api_key_env: API_KEY
      model_name: gemma-4-31B-it
      max_retries: 3
      max_tokens: 768
      temperature: 0.0
      max_pixels: 1048576
      skip_existing: true