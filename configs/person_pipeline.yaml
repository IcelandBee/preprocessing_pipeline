input:
  input_dir: /DATA/raw/person_images
  recursive: true
  image_exts: [".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff"]

output:
  run_root: outputs/runs
  pass_archive_dir: /DATA/clean/person_dataset_v1
  pass_archive_layout: run_subdir
  overwrite: false

filter:
  short_circuit: true
  operators:
    - name: aspect_ratio
      enabled: true
      params:
        ratio: 2.0
    - name: gray_style
      enabled: true
      params:
        threshold: 1.0
    - name: framebox
      enabled: true
      params:
        max_side: 1024
        sides: 3
        min_thick: 20
        max_ratio: 0.30
        min_std: 15.0
    - name: duplicate
      enabled: true
      params:
        threshold: 9
        hash_size: 8

label:
  enabled: true
  input_dir: auto
  annotation_dir: auto
  jsonl_path: auto
  operator:
    name: person_attribute_labeler
    params:
      base_url: http://10.154.39.71:8001/v1
      api_key_env: API_KEY
      model_name: Qwen3.5-27B
      workers: 8
      max_retries: 3
      max_tokens: 224
      temperature: 0.0
      max_pixels: 589824
      skip_existing: true
