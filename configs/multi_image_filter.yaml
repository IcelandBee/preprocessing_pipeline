input:
  input_dir: /mnt/DATA_71/public/data/MultiImage_Data/20260519/test
  recursive: true
  image_exts: [".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff"]

output:
  run_root: /mnt/DATA_71/public/data/MultiImage_Data/multi_image_data_annotation
  pass_archive_dir: /mnt/DATA_71/public/data/MultiImage_Data/multi_image_data
  pass_archive_layout: run_subdir
  run_id_prefix: auto
  overwrite: false

filter:
  short_circuit: true
  operators:
    - name: aspect_ratio
      enabled: true
      params:
        ratio: 2.0
    - name: gray_style
      enabled: true
      params:
        threshold: 1.0
        max_side: 1600
    - name: framebox
      enabled: true
      params:
        max_side: 1024
        sides: 3
        min_thick: 20
        max_ratio: 0.30
        min_std: 15.0
    - name: person_blur
      enabled: true
      params:
        max_side: 1024
        person_thr: 120.0
        face_thr: 90.0
        pad_frac: 0.08
    - name: compression_quality
      enabled: true
      params:
        min_quality_threshold: 0.2
    - name: stitch_v2
      enabled: true
      params:
        max_side: 1400
        prominence: 6.0
    - name: duplicate
      enabled: true
      params:
        threshold: 9
        hash_size: 8

label:
  enabled: false